sonar.projectKey=Sunbird-RC_sunbird-rc-core
sonar.organization=sunbird-rc
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8

# Whole repo, so Dockerfiles, workflows and configs are analyzed alongside the
# Java (java/), TypeScript (services/) and Go (services/) sources.
sonar.sources=.

# Java rules need compiled classes; .github/workflows/sonarcloud.yml builds them first.
sonar.java.binaries=**/target/classes

sonar.test.inclusions=**/src/test/**,**/test/**,**/*.spec.ts,**/*.test.ts,**/*_test.go

sonar.exclusions=**/node_modules/**,**/target/**,**/build/**,**/dist/**,**/coverage/**,**/.scannerwork/**,**/swagger_gen/**,**/ui-sample/**/assets/**,**/*.min.js,**/prisma/migrations/**

sonar.coverage.exclusions=**/src/test/**,**/test/**,**/*.spec.ts,**/*.test.ts,**/*_test.go

# Produced by the jacoco-maven-plugin already configured in java/registry and
# java/elastic-search when the Maven build runs its unit tests.
sonar.coverage.jacoco.xmlReportPaths=java/registry/target/site/jacoco/jacoco.xml,java/elastic-search/target/site/jacoco/jacoco.xml
