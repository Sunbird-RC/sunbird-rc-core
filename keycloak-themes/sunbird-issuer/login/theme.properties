# Sign-in theme for the issuer deployment.
#
# Inherits the stock `keycloak` login theme and overrides only the stylesheet.
# Deliberately no FreeMarker templates: this is Keycloak 14, whose login templates
# differ from 17+ and again from 22+, so a copied .ftl would silently break the
# moment the image is upgraded — and every element that needed restyling here is
# reachable from CSS.
parent=keycloak
import=common/keycloak

# Resources resolve through the theme chain, so the first two come from the parent
# and only the last is ours. Ours is listed last so it wins on equal specificity.
# The filename carries a version. Keycloak's /resources/<hash>/ segment comes from
# the SERVER build, not from theme contents, so editing a stylesheet in place keeps
# the same URL and caches in the chain keep serving the previous copy — observed on
# this deployment. Bump this suffix whenever the stylesheet changes.
styles=css/login.css css/tile.css css/sunbird-issuer-v2.css
