# Deployable subset of the stack — ONLY the services actually stood up and
# verified end-to-end in this session's testing (T2 topology, no Java
# registry/keycloak/claim-ms/elasticsearch/kafka): db, vault, redis, identity,
# credential-schema, credentials-service, oid4vc-service.
#
# Images are the exact, already-tested builds pushed to Docker Hub this
# session (see TESTING.md for the full verification run — 32/32 requests,
# 0 failures) rather than ghcr.io/sunbird-rc/* or local `build:` contexts.
#
# Usage:
#   docker compose -f docker-compose.cloud.yml up -d
#
# Required one-time setup before first `up`:
#   1. Create a .env file alongside this compose file with at least:
#        POSTGRES_PASSWORD=<strong password>
#        VAULT_TOKEN=<vault token — see step 2>
#        OID4VC_PUBLIC_URL=https://<your-domain>       (real external URL, not localhost)
#        OID4VC_ISSUER_DID=<pinned DID — see step 3>
#      (all other vars below have safe defaults for this topology)
#   2. Vault ships unconfigured for production (file backend, manual unseal —
#      see services/oid4vc-service/README.md §8 (Production Deployment Guide) for hardening recommendations).
#      First run: `docker compose -f docker-compose.cloud.yml up -d vault`,
#      then `vault operator init` / `vault operator unseal` against it
#      (see setup_vault.sh / enable-v2.sh in the repo root for the pattern),
#      and set VAULT_TOKEN from the resulting root/scoped token.
#   3. Pin ISSUER_DID once identity is up (do NOT leave blank in production —
#      see services/oid4vc-service/README.md §8 (Production Deployment Guide)):
#        curl -s -X POST http://<host>:3332/did/generate -H "Content-Type: application/json" \
#          -d '{"content":[{"alsoKnownAs":["oid4vc-issuer-prod"],"services":[],"method":"rcw"}]}'
#      then set OID4VC_ISSUER_DID to the returned `id` and restart oid4vc-service.

services:
  db:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=registry
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: vault:1.13.3
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault.json:/vault/config/vault.json
      - vault-data:/vault/file
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_API_ADDR=http://vault:8200
      - VAULT_ADDRESS=http://vault:8200
    command: vault server -config=/vault/config/vault.json
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider http://127.0.0.1:8200/v1/sys/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  identity:
    # Patched fork image. OID4VC_FIX_ORG/OID4VC_FIX_TAG are deliberately kept
    # separate from the tag the unpatched services use: only identity,
    # credential and oid4vc-service carry local fixes, and a single shared
    # OID4VC_IMAGE_TAG (read by six services) has twice retagged services that
    # have no fork image and broken the stack.
    image: docker.io/${OID4VC_FIX_ORG:-snt1}/sunbird-rc-identity-service:${OID4VC_FIX_TAG:-oid4vc}
    # amd64-only image (Prisma 4.8.1 has no arm64-musl query engine — same
    # constraint documented in docker-compose.override.yml). Most cloud VMs
    # are amd64 by default; this makes that explicit rather than relying on
    # the pull host's native arch.
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/identity
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:?set VAULT_TOKEN in .env — see header comment step 2}
      - VAULT_BASE_URL=http://vault:8200/v1/
      - VAULT_ROOT_PATH=${VAULT_ROOT_PATH-kv}
      - VAULT_TIMEOUT=${VAULT_TIMEOUT-5000}
      - VAULT_PROXY=${VAULT_PROXY-false}
      - SIGNING_ALGORITHM=${SIGNING_ALGORITHM-Ed25519Signature2020}
      - JWKS_URI=${JWKS_URI-}
      - ENABLE_AUTH=${ENABLE_AUTH-false}
      - WEB_DID_BASE_URL=${WEB_DID_BASE_URL-}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3332/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  credential-schema:
    image: docker.io/snt1/sunbird-rc-credential-schema:${OID4VC_IMAGE_TAG-oid4vc}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/credential_schema
      - IDENTITY_BASE_URL=http://identity:3332
      - JWKS_URI=${JWKS_URI-}
      - ENABLE_AUTH=${ENABLE_AUTH-false}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3333/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  credential:
    # Patched fork image — see the note on `identity` above.
    image: docker.io/${OID4VC_FIX_ORG:-snt1}/sunbird-rc-credentials-service:${OID4VC_FIX_TAG:-oid4vc}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/credential
      - IDENTITY_BASE_URL=http://identity:3332
      - SCHEMA_BASE_URL=http://credential-schema:3333
      - CREDENTIAL_SERVICE_BASE_URL=http://credential:3000
      - JWKS_URI=${JWKS_URI-}
      - ENABLE_AUTH=${ENABLE_AUTH-false}
      - QR_TYPE=${QR_TYPE-W3C_VC}
      # Recommended true in production — otherwise OID4VP's revocation check
      # always trivially passes (see services/oid4vc-service/README.md §8 (Production Deployment Guide)).
      - STATUS_LIST_ENABLED=${STATUS_LIST_ENABLED-true}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  oid4vc-service:
    # Patched fork image — see the note on `identity` above.
    image: docker.io/${OID4VC_FIX_ORG:-snt1}/sunbird-rc-oid4vc-service:${OID4VC_FIX_TAG:-oid4vc}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      credential:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=3400
      # MUST be the real externally-reachable HTTPS URL — embedded as
      # iss/aud in minted tokens, JARs, and PoP checks (services/oid4vc-service/README.md §8 (Production Deployment Guide)).
      - PUBLIC_URL=${OID4VC_PUBLIC_URL:?set OID4VC_PUBLIC_URL in .env to your real domain, e.g. https://issuer.example.com}
      - CREDENTIAL_SERVICE_BASE_URL=http://credential:3000
      - IDENTITY_BASE_URL=http://identity:3332
      - SCHEMA_BASE_URL=http://credential-schema:3333
      - REDIS_URL=redis://redis:6379
      # redis required for any multi-replica/production deployment — see
      # services/oid4vc-service/README.md §8 (Production Deployment Guide)
      - SESSION_STORE=redis
      # Must be pinned in production — see header comment step 3 and
      # services/oid4vc-service/README.md §8 (Production Deployment Guide).
      # Left blank, a fresh ephemeral DID is generated on every restart,
      # invalidating all previously-minted tokens.
      - ISSUER_DID=${OID4VC_ISSUER_DID:?set OID4VC_ISSUER_DID in .env — see header comment step 3}
      - OID4VP_ENABLED=${OID4VP_ENABLED-true}
      # Set true only if targeting MOSIP Inji Wallet (draft-13 shapes) — see
      # services/oid4vc-service/README.md §8 (Production Deployment Guide).
      # Default false = final OID4VCI/OID4VP 1.0.
      - DRAFT13_COMPAT_MODE=${OID4VC_DRAFT13_COMPAT-false}
      # OID4VP request-object signing (JAR, draft-23) — ON by default, which
      # is the spec-correct posture for production. Requires a VERIFIER_DID
      # (or a did:web ISSUER_DID) that WALLETS can resolve; a did:rcw is NOT
      # sufficient, and /vp/request fails loudly rather than emitting a
      # request no wallet can verify. Set OID4VP_SIGN_REQUEST=false only as a
      # deliberate interop concession, or OID4VP_LEGACY_CLIENT_ID_SCHEME=true
      # for wallets stuck on the pre-draft-22 client_id_scheme shape (walt.id).
      - OID4VP_SIGN_REQUEST=${OID4VP_SIGN_REQUEST-true}
      - OID4VP_LEGACY_CLIENT_ID_SCHEME=${OID4VP_LEGACY_CLIENT_ID_SCHEME-false}
      - VERIFIER_DID=${OID4VC_VERIFIER_DID-}
      # CORS defaults to allow-all (with a startup warning) for backward
      # compatibility — set this to your actual frontend origin(s) in
      # production. See services/oid4vc-service/README.md §8 (Production Deployment Guide)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS-}
      # No attestation/claims workflow is wired up — deferred_claim_id offers
      # stay pending forever unless explicitly opted into. See
      # services/oid4vc-service/README.md §8 (Production Deployment Guide)
      - DEFERRED_CLAIMS_ALWAYS_READY=${DEFERRED_CLAIMS_ALWAYS_READY-false}
      - INTERNAL_HTTP_TIMEOUT_MS=${INTERNAL_HTTP_TIMEOUT_MS-10000}
      # --- Wallet self-service issuance ---------------------------------
      # Setting KEYCLOAK_PUBLIC_URL turns this on. Issuer metadata then
      # advertises the realm as an authorization server, so a wallet runs
      # authorization_code + PKCE against Keycloak directly and presents the
      # resulting token here; this service implements no /authorize of its own.
      # Claims for those requests come from the registry record named by the
      # token, never from the request body — which is what makes a holder able
      # to obtain only their OWN credential.
      # Leave unset to keep the pre-authorized_code-only behaviour.
      - KEYCLOAK_PUBLIC_URL=${OID4VC_KEYCLOAK_PUBLIC_URL-}
      - KEYCLOAK_INTERNAL_URL=${OID4VC_KEYCLOAK_INTERNAL_URL-http://keycloak:8080/auth}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM-sunbird-rc}
      # Token claim carrying the holder's registry key. Written onto the
      # Keycloak user by the issuer portal's "link login" action.
      - KEYCLOAK_SUBJECT_CLAIM=${KEYCLOAK_SUBJECT_CLAIM-farmerId}
      # Optional `aud` check. Keycloak's default access token has aud=account,
      # so leave blank unless a dedicated audience mapper is configured.
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE-}
      - REGISTRY_BASE_URL=${OID4VC_REGISTRY_BASE_URL-http://registry:8081}
      # POST /oid4vc/offer trusts caller-supplied claims, so while this is
      # false ANYONE who can reach it can mint a credential about anyone (the
      # service logs a warning at first use). Set true — together with
      # KEYCLOAK_PUBLIC_URL — to require the issuer-staff realm role.
      # Default false so existing callers keep working.
      - OFFER_REQUIRES_STAFF=${OFFER_REQUIRES_STAFF-false}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` here — nginx (below) is the single public entrypoint.
    # Exposing 3400 directly bypasses whatever hardening (TLS, rate limiting,
    # the /oid4vc/offer auth gap in services/oid4vc-service/README.md §8 (Production Deployment Guide)) sits in
    # nginx; only add a direct port mapping here for local debugging.

  # Sunbird RC registry — schema-driven entity CRUD, and the system of record
  # for the data credentials are issued FROM (farmers, land parcels, crops,
  # seed distributions). Issuance reads these records; it no longer trusts
  # caller-supplied claims.
  #
  # elasticsearch and kafka are deliberately absent from this topology, so
  # search falls back to the native (Postgres) provider and events are off.
  # Both are opt-in upstream, so this is configuration, not a patch.
  registry:
    # v2.0.3 is the newest tag actually published on ghcr — v2.0.4 does not
    # exist, and defaulting to it made the service unpullable.
    image: ghcr.io/sunbird-rc/sunbird-rc-core:${RELEASE_VERSION:-v2.0.3}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Entity definitions. Adding a JSON file here and restarting is all it
      # takes to expose a new entity's CRUD API — no image rebuild.
      - ./registry-schemas:/home/sunbirdrc/config/public/_schemas
    environment:
      # The `db` container already provisions this database (POSTGRES_DB above).
      - connectionInfo_uri=jdbc:postgresql://db:5432/registry
      - connectionInfo_username=postgres
      - connectionInfo_password=${POSTGRES_PASSWORD}
      - event_enabled=false
      - search_providerName=dev.sunbirdrc.registry.service.NativeSearchService
      - elastic_search_enabled=false
      # Keycloak is the single identity provider for the portal, the wallet and
      # this registry — the whole point of the design. Roles are read from the
      # realm_access.roles claim of the presented bearer token.
      - sunbird_sso_realm=${KEYCLOAK_REALM-sunbird-rc}
      - sunbird_sso_url=http://keycloak:8080/auth
      - OAUTH2_RESOURCES_0_URI=http://keycloak:8080/auth/realms/${KEYCLOAK_REALM-sunbird-rc}
      - OAUTH2_RESOURCES_0_PROPERTIES_ROLES_PATH=realm_access.roles
      - authentication_enabled=${REGISTRY_AUTH_ENABLED-true}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8081/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10

  test-wallet:
    image: docker.io/snt1/sunbird-rc-oid4vc-test-wallet:${OID4VC_IMAGE_TAG-oid4vc}
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:80/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # OID4VP verifier console (Vite/React build served by nginx:alpine). Fronted
  # by the gateway at /verifier-app/. The browser talks to oid4vc-service
  # same-origin; this container holds no secrets and keeps no state.
  verifier-app:
    image: docker.io/${VERIFIER_APP_ORG:-pallakartheekreddy}/sunbird-rc-oid4vc-verifier-app:${VERIFIER_APP_TAG:-1.0.0}
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:80/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # Issuer portal — staff-facing CRUD over the registry plus credential
  # issuance. Unlike verifier-app this is NOT a pure static bundle: it ships a
  # backend-for-frontend because the Keycloak client is confidential and its
  # secret must never reach the browser. The BFF also holds the session cookie
  # and proxies registry/oid4vc calls, so no token is exposed to page scripts.
  issuer-portal:
    image: docker.io/${ISSUER_PORTAL_ORG:-pallakartheekreddy}/sunbird-rc-oid4vc-issuer-portal:${ISSUER_PORTAL_TAG:-0.1.0}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      oid4vc-service:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      - PORT=4100
      - PUBLIC_BASE_URL=${OID4VC_PUBLIC_URL}
      - BASE_PATH=/issuer-portal
      # Browser-facing Keycloak URL (redirects) vs in-cluster URL (token and
      # userinfo calls). They differ, and conflating them is the classic
      # Keycloak-behind-a-gateway failure: the redirect must be public, the
      # back-channel must not leave the compose network.
      - KEYCLOAK_PUBLIC_URL=${OID4VC_PUBLIC_URL}/auth
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=${KEYCLOAK_REALM-sunbird-rc}
      - KEYCLOAK_CLIENT_ID=${ISSUER_PORTAL_CLIENT_ID-issuer-portal}
      - KEYCLOAK_CLIENT_SECRET=${ISSUER_PORTAL_CLIENT_SECRET:?set ISSUER_PORTAL_CLIENT_SECRET in .env}
      - SESSION_SECRET=${ISSUER_PORTAL_SESSION_SECRET:?set ISSUER_PORTAL_SESSION_SECRET in .env}
      - REGISTRY_BASE_URL=http://registry:8081
      - OID4VC_BASE_URL=http://oid4vc-service:3400
      - SCHEMA_BASE_URL=http://credential-schema:3333
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4100/healthz >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: ghcr.io/sunbird-rc/sunbird-rc-nginx
    restart: unless-stopped
    depends_on:
      oid4vc-service:
        condition: service_healthy
      test-wallet:
        condition: service_healthy
    volumes:
      # The published sunbird-rc-nginx image's baked-in config has NO
      # oid4vc/vp routes at all (verified by inspecting the image directly)
      # — this mount is load-bearing, not cosmetic.
      - ./nginx/nginx.cloud.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS material for the 443 listener (self-signed today; see conf comment).
      - ./nginx/certs:/etc/nginx/certs:ro
      # ACME HTTP-01 webroot + Let's Encrypt store, for a real certificate.
      - ./nginx/acme-webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      # 80 = plain HTTP (API + wallet for the 3 JOSE formats). 443 = HTTPS,
      # required for the browser wallet's mso_mdoc (WebCrypto secure context).
      - '80:80'
      - '443:443'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: identity/credential-schema/credential intentionally have no
  # `ports:` mapping above — they're internal-only management/signing APIs
  # in this topology and only need to be reachable from other containers on
  # the compose network. For direct debugging, add e.g. `ports: ['3332:3332']`
  # to the identity service block above.

volumes:
  db-data:
  vault-data:
  redis-data:
