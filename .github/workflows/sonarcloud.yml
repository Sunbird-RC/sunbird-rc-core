name: SonarQube Cloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so SonarQube Cloud can attribute issues to the right commit.
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up properties
        run: sh configure-dependencies.sh

      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

      # Java rules need compiled classes (sonar.java.binaries), and running the
      # unit tests is what makes jacoco emit the coverage XML that Sonar reads.
      - name: Build Java modules
        working-directory: java
        run: ./mvnw -B install

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
