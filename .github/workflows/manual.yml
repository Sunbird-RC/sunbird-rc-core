# This is a basic workflow that is manually triggered
# It runs the test gates, builds every image in the Makefile's IMAGES list,
# scans them, and only then pushes :latest and :<version>.

name: Build and Publish

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch: # Inputs the workflow accepts.
    inputs:
      version:
        description: 'Enter the version number of the build to be generated'
        required: true
        type: string
      dry_run:
        description: 'Dry run: run tests, build and scan all images, but do not push'
        required: false
        type: boolean
        default: false
      tag_latest:
        description: 'Also push :latest (tick only for the newest release line)'
        required: false
        type: boolean
        default: false

env:
  DOCKER_REGISTRY: ghcr.io

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  registry-tests:
    name: Registry (Java) tests
    uses: ./.github/workflows/maven.yml

  services-tests:
    name: V2 services tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  release-all:
    name: Build Docker Images and Push to Github Container Registry
    needs: [ registry-tests, services-tests ]
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUSH_LATEST: ${{ inputs.tag_latest }}
      TRIVY: >-
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}:/src -w /src -v trivy-cache:/root/.cache/trivy
        aquasec/trivy:0.63.0@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: 'maven'
      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
      - name: Build all images
        # make build expects target/ to exist; it is gitignored
        run: |
          mkdir -p target
          make build
      - name: Scan images (blocks release on fixable CRITICAL)
        run: make scan-images TRIVY="$TRIVY"
      - name: Log in to GHCR Docker Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        if: ${{ !inputs.dry_run }}
        run: make push-images RELEASE_VERSION="$RELEASE_VERSION" PUSH_LATEST="$PUSH_LATEST"
