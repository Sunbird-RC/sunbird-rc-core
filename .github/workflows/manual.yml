# Release build for the V2 credentialling services.
# Builds identity, credential-schema, credentials and oid4vc images and pushes
# them to ghcr.io/sunbird-rc/<image>:<version>.
#
# Triggers:
#   - push a tag (e.g. git tag v2.1.0.1 && git push origin v2.1.0.1)
#     -> version = tag name
#   - manual run from the Actions tab -> version = input

name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish, e.g. v2.1.0.1'
        required: true
        type: string
      tag_latest:
        description: 'Also push :latest (only for the newest release line)'
        required: false
        type: boolean
        default: false

env:
  DOCKER_REGISTRY: ghcr.io
  # tag push -> tag name; manual run -> input
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  TAG_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_latest || false }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        run: |
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+(\.[0-9]+){2,3}(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version must look like v2.1.0.1 (got '$VERSION')"
            exit 1
          fi

  release-services:
    name: Build and push ${{ matrix.image }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: services/identity-service
            image: sunbird-rc-identity-service
          - path: services/credential-schema
            image: sunbird-rc-credential-schema
          - path: services/credentials-service
            image: sunbird-rc-credentials-service
          - path: services/oid4vc-service
            image: sunbird-rc-oid4vc-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # repo owner, lowercased: Sunbird-RC -> ghcr.io/sunbird-rc, a fork -> ghcr.io/<fork owner>
      - name: Set image namespace
        run: echo "DOCKER_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR Docker Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
