server {
    listen 80;

    # Docker's embedded DNS. Needed so the oid4vc-service upstream below (only
    # started when the "oid4vc" compose profile is enabled) is resolved lazily
    # at request time via a variable, instead of at config-parse time — a
    # literal hostname in proxy_pass makes nginx fail to start with "host not
    # found in upstream" whenever that profile is off, taking the whole
    # gateway down with it.
    resolver 127.0.0.11 valid=10s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    location /registry/ {
          proxy_pass http://registry:8081/;
    }

    location /claim-ms/ {
          proxy_pass http://claim-ms:8082/;
    }

    location /bucket/ {
          proxy_pass http://file-storage:9000/;
    }

    location /proxy/ {
          proxy_pass http://context-proxy-service:4400/proxy/;
    }

    location /public-key-service/ {
          proxy_pass http://public-key-service:3300/public-key-service/;
    }
    location /auth/ {
          proxy_pass          http://keycloak:8080/auth/;
          proxy_set_header    Host               $host;
          proxy_set_header    X-Real-IP          $remote_addr;
          proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
          proxy_set_header    X-Forwarded-Host   $host;
          proxy_set_header    X-Forwarded-Server $host;
          proxy_set_header    X-Forwarded-Port   $server_port;
          proxy_set_header    X-Forwarded-Proto  $scheme;
    }

    # OID4VCI / OID4VP public gateway (additive; only active when oid4vc-service is deployed).
    # proxy_pass targets are a variable (not a literal hostname) precisely so
    # the resolver above kicks in and these locations degrade to a per-request
    # 502 when oid4vc-service isn't running, rather than blocking nginx from
    # starting at all. A variable target with no URI passes the original
    # request URI through unchanged, so these remain pure pass-throughs.
    location /oid4vc/ {
          set $oid4vc_upstream http://oid4vc-service:3400;
          proxy_pass $oid4vc_upstream;
    }

    location /vp/ {
          set $oid4vc_upstream http://oid4vc-service:3400;
          proxy_pass $oid4vc_upstream;
    }

    # OID4VCI issuer metadata discovery
    location /.well-known/openid-credential-issuer {
          set $oid4vc_upstream http://oid4vc-service:3400;
          proxy_pass $oid4vc_upstream;
    }

    # oid4vc-service's own OAuth AS metadata + JWKS (pre-authorized_code grant)
    location /.well-known/openid-configuration {
          set $oid4vc_upstream http://oid4vc-service:3400;
          proxy_pass $oid4vc_upstream;
    }

    # This one actually rewrites the path (/oid4vc-jwks.json -> /.well-known/jwks.json),
    # so unlike the pass-throughs above it needs an explicit rewrite before the
    # variable-based proxy_pass, which otherwise would forward the original
    # unrewritten URI.
    location /oid4vc-jwks.json {
          rewrite ^/oid4vc-jwks\.json$ /.well-known/jwks.json break;
          set $oid4vc_upstream http://oid4vc-service:3400;
          proxy_pass $oid4vc_upstream;
    }


    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
    root   /usr/share/nginx/html;
    }
}