# Gateway for the localhost end-to-end stack (docker-compose.local.yml).
#
# Same routing shape as nginx.cloud.conf, minus TLS — everything is
# same-origin on http://localhost, which is what lets the browser talk to the
# portal, the wallet endpoints and Keycloak without CORS.
#
# `resolver` plus variable proxy_pass is used throughout so nginx re-resolves
# container names at request time. Without it, nginx caches the first IP at
# startup and every `docker compose restart <service>` yields 502s until nginx
# is reloaded — a recurring annoyance on the deployed stack.
server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Generous, because amd64 emulation makes the Java registry slow to answer.
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- issuer portal (BFF; prefix must be preserved for the OAuth
    # redirect_uri and the session cookie path to keep matching) ---
    location = /issuer-portal { return 301 /issuer-portal/; }
    location /issuer-portal {
        set $up http://issuer-portal:4100;
        proxy_pass $up;
    }

    # --- verifier console (static bundle; prefix stripped) ---
    location = /verifier-app { return 301 /verifier-app/; }
    location /verifier-app/ {
        set $up http://verifier-app:80;
        proxy_pass $up/;
    }

    # --- Keycloak ---
    # Must be reachable from the BROWSER at the same origin the portal
    # advertises, or the login redirect lands somewhere unresolvable.
    location /auth {
        set $up http://keycloak:8080;
        proxy_pass $up;
    }

    # --- OID4VCI / OID4VP wallet-facing endpoints ---
    location /oid4vc {
        set $up http://oid4vc-service:3400;
        proxy_pass $up;
    }
    location /vp {
        set $up http://oid4vc-service:3400;
        proxy_pass $up;
    }
    location /qr {
        set $up http://oid4vc-service:3400;
        proxy_pass $up;
    }
    location /vct {
        set $up http://oid4vc-service:3400;
        proxy_pass $up;
    }
    location /contexts {
        set $up http://oid4vc-service:3400;
        proxy_pass $up;
    }
    location /render-templates {
        set $up http://oid4vc-service:3400;
        proxy_pass $up;
    }
    location = /.well-known/openid-credential-issuer {
        set $up http://oid4vc-service:3400;
        proxy_pass $up/.well-known/openid-credential-issuer;
    }
    location = /.well-known/openid-configuration {
        set $up http://oid4vc-service:3400;
        proxy_pass $up/.well-known/openid-configuration;
    }
    location = /.well-known/jwks.json {
        set $up http://oid4vc-service:3400;
        proxy_pass $up/.well-known/jwks.json;
    }
    location /.well-known/vct {
        set $up http://oid4vc-service:3400;
        proxy_pass $up;
    }
    location = /health {
        set $up http://oid4vc-service:3400;
        proxy_pass $up/health;
    }

    # --- registry (farmer/land/crop/seed records) ---
    # An explicit `rewrite` is required, not a trailing slash on proxy_pass.
    # When proxy_pass contains a VARIABLE, nginx forwards the original URI
    # unchanged and the usual prefix-stripping does not happen — so
    # `proxy_pass $up/` still sent /registry/health upstream and 404'd. The
    # variable is what makes nginx re-resolve the container name per request,
    # which is worth keeping, so the rewrite does the stripping instead.
    location /registry/ {
        # `set` MUST come before `rewrite ... break`. Both are rewrite-module
        # directives, and `break` ends that phase — so a `set` placed after it
        # never executes, leaving $up empty and nginx answering 500 with
        # "using uninitialized \"up\" variable / invalid URL prefix".
        set $up http://registry:8081;
        rewrite ^/registry/(.*)$ /$1 break;
        proxy_pass $up;
    }
    # The registry's own API is served at /api/v1/*; the portal BFF talks to it
    # in-cluster, but exposing it here makes curl-based debugging possible.
    location /api/v1 {
        set $up http://registry:8081;
        proxy_pass $up;
    }

    # --- identity-service: DID documents and utilities ---
    location /did {
        set $up http://identity:3332;
        proxy_pass $up;
    }
    # did:web documents live at /<uuid>/did.json. `{36}` MUST sit inside a
    # quoted regex — unquoted, nginx reads the brace as a block and refuses to
    # start.
    location ~ "^/[0-9a-fA-F-]{36}/did\.json$" {
        set $up http://identity:3332;
        proxy_pass $up;
    }
    location /utils {
        set $up http://identity:3332;
        proxy_pass $up;
    }
    # Distinct prefixes for each backend's health probe: they all serve /health,
    # so the gateway needs a unique path per service to be able to reach them.
    location = /identity-health {
        set $up http://identity:3332;
        proxy_pass $up/health;
    }
    location = /credential-health {
        set $up http://credential:3000;
        proxy_pass $up/health;
    }
    location = /schema-health {
        set $up http://credential-schema:3333;
        proxy_pass $up/health;
    }

    # --- credential-schema + credentials-service ---
    location /credential-schema {
        set $up http://credential-schema:3333;
        proxy_pass $up;
    }
    location /credentials {
        set $up http://credential:3000;
        proxy_pass $up;
    }

    location = / { return 302 /issuer-portal/; }
}
